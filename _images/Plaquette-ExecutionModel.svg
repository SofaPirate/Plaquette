<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 360" font-family="monospace" font-size="13">
  <!-- INITIALIZATION box -->
  <rect x="20" y="20" width="460" height="120" rx="8" ry="8" fill="#f8f8f8" stroke="#333" stroke-width="2"/>
  <text x="250" y="50" text-anchor="middle" font-weight="bold" font-size="15">INITIALIZATION</text>
  <line x1="40" y1="62" x2="460" y2="62" stroke="#333" stroke-width="1"/>
  <text x="40" y="85" font-size="12">1. User's prepare() executes</text>
  <text x="40" y="105" font-size="12">2. Engine.preBegin() → calls begin() on all units</text>
  <text x="40" y="125" font-size="12">3. User's begin() executes</text>

  <!-- Arrow -->
  <line x1="250" y1="140" x2="250" y2="180" stroke="#333" stroke-width="2"/>
  <polygon points="250,195 242,178 258,178" fill="#333"/>
  <text x="270" y="172" font-size="11" font-style="italic" fill="#666">(repeats)</text>

  <!-- MAIN LOOP box -->
  <rect x="20" y="200" width="460" height="140" rx="8" ry="8" fill="#f8f8f8" stroke="#333" stroke-width="2"/>
  <text x="250" y="230" text-anchor="middle" font-weight="bold" font-size="15">MAIN LOOP</text>
  <line x1="40" y1="242" x2="460" y2="242" stroke="#333" stroke-width="1"/>
  <text x="40" y="268" font-size="12">1. Engine.timeStep() → checks timing</text>
  <text x="40" y="288" font-size="12">2. Engine.preStep() → calls step() on all units</text>
  <text x="40" y="308" font-size="12">3. User's step() executes</text>
  <text x="40" y="328" font-size="12">4. Events are dispatched</text>
</svg>
